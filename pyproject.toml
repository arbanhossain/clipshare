[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipshare"
version = "0.1.0"
description = "Share clipboard history (text and images) between laptops over LAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.scripts]
clipshare = "clipshare.cli:main"

[tool.setuptools]
packages = ["clipshare"]
